<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto-Bingo</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #24302b;
    --muted: #6b756f;
    --accent: #2f6b4f;
    --accent-dark: #214d39;
    --line: #d8ddd8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  .page {
    width: min(1100px, 94vw);
    margin: 0 auto;
    padding: 36px 0 48px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 5vw, 3.5rem);
    letter-spacing: -0.04em;
  }

  .intro {
    margin: 0 auto;
    max-width: 650px;
    color: var(--muted);
    line-height: 1.5;
  }

  .bingo {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    background: var(--accent-dark);
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 18px 45px rgba(0,0,0,.12);
  }

  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    min-width: 0;
    overflow: hidden;
    border-radius: 12px;
    background: var(--card);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .cell:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(0,0,0,.15);
  }

  .cell input {
    display: none;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px;
    text-align: center;
  }

  .camera {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    margin-bottom: 8px;
  }

  .task {
    font-size: clamp(.72rem, 1.45vw, 1rem);
    font-weight: 700;
    line-height: 1.25;
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .cell.done .photo { display: block; }

  .cell.done::after {
    content: "✓";
    position: absolute;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: white;
    color: var(--accent);
    font-weight: 900;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }

  .cell.done .placeholder {
    inset: auto 0 0;
    padding: 8px;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    color: white;
    justify-content: flex-end;
    align-items: flex-start;
    text-align: left;
  }

  .cell.done .camera { display: none; }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  button {
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    font: inherit;
    font-weight: 750;
    cursor: pointer;
  }

  #reset {
    background: var(--accent);
    color: white;
  }

  #reset:hover { background: var(--accent-dark); }

  .progress {
    margin-top: 18px;
    text-align: center;
    color: var(--muted);
    font-weight: 650;
  }

  .bingo-message {
    display: none;
    margin: 20px auto 0;
    width: fit-content;
    padding: 14px 22px;
    border-radius: 14px;
    background: #fff;
    font-size: 1.2rem;
    font-weight: 850;
    box-shadow: 0 8px 25px rgba(0,0,0,.1);
  }

  .bingo-message.show { display: block; }

  @media (max-width: 650px) {
    .page { width: 96vw; padding-top: 24px; }
    .bingo { gap: 5px; padding: 5px; border-radius: 12px; }
    .cell { border-radius: 7px; }
    .placeholder { padding: 5px; }
    .camera { margin-bottom: 3px; }
    .cell.done::after {
      width: 22px;
      height: 22px;
      top: 4px;
      right: 4px;
      font-size: .8rem;
    }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>📸 Foto-Bingo</h1>
    <p class="intro">
      Fotografiere die gesuchten Dinge und fülle damit dein Bingo-Feld.
      Tippe einfach auf ein Feld, um ein Foto aufzunehmen oder auszuwählen.
    </p>
  </header>

  <section class="bingo" id="bingo" aria-label="5 mal 5 Bingo-Raster"></section>

  <div class="progress" id="progress">0 von 25 Feldern ausgefüllt</div>
  <div class="bingo-message" id="bingoMessage">🎉 BINGO! Eine Reihe ist vollständig.</div>

  <div class="controls">
    <button id="reset" type="button">Bingo zurücksetzen</button>
  </div>
</main>

<script>
  // Hier später einfach die 25 Aufgaben ersetzen.
  const tasks = [
    "Aufgabe 1",  "Aufgabe 2",  "Aufgabe 3",  "Aufgabe 4",  "Aufgabe 5",
    "Aufgabe 6",  "Aufgabe 7",  "Aufgabe 8",  "Aufgabe 9",  "Aufgabe 10",
    "Aufgabe 11", "Aufgabe 12", "Aufgabe 13", "Aufgabe 14", "Aufgabe 15",
    "Aufgabe 16", "Aufgabe 17", "Aufgabe 18", "Aufgabe 19", "Aufgabe 20",
    "Aufgabe 21", "Aufgabe 22", "Aufgabe 23", "Aufgabe 24", "Aufgabe 25"
  ];

  const bingo = document.getElementById("bingo");
  const progress = document.getElementById("progress");
  const bingoMessage = document.getElementById("bingoMessage");

  function buildBoard() {
    bingo.innerHTML = "";

    tasks.forEach((task, index) => {
      const cell = document.createElement("label");
      cell.className = "cell";
      cell.dataset.index = index;

      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.capture = "environment";
      input.setAttribute("aria-label", `${task}: Foto auswählen`);

      const img = document.createElement("img");
      img.className = "photo";
      img.alt = task;

      const placeholder = document.createElement("div");
      placeholder.className = "placeholder";
      placeholder.innerHTML = `
        <div class="camera">📷</div>
        <div class="task">${task}</div>
      `;

      cell.append(input, img, placeholder);
      bingo.appendChild(cell);

      input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        img.src = url;
        cell.classList.add("done");
        updateProgress();
        checkBingo();
      });
    });
  }

  function updateProgress() {
    const done = document.querySelectorAll(".cell.done").length;
    progress.textContent = `${done} von 25 Feldern ausgefüllt`;
  }

  function checkBingo() {
    const cells = [...document.querySelectorAll(".cell")];
    const lines = [];

    for (let row = 0; row < 5; row++) {
      lines.push([0,1,2,3,4].map(col => row * 5 + col));
    }

    for (let col = 0; col < 5; col++) {
      lines.push([0,1,2,3,4].map(row => row * 5 + col));
    }

    lines.push([0, 6, 12, 18, 24]);
    lines.push([4, 8, 12, 16, 20]);

    const hasBingo = lines.some(line =>
      line.every(index => cells[index].classList.contains("done"))
    );

    bingoMessage.classList.toggle("show", hasBingo);
  }

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("Möchtest du das Bingo wirklich zurücksetzen?")) return;
    buildBoard();
    updateProgress();
    bingoMessage.classList.remove("show");
  });

  buildBoard();
</script>
</body>
</html>
